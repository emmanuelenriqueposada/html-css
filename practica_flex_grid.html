<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Fin Pude</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  :root {
    --box-color: #075e35;
    --secondary-color: #fff;
    --font-family: "Poppins", sans-serif;
  }
  .grid {
    display: grid;
    width: 99%;
    grid-template-rows: repeat(4, 100px);
    grid-template-columns: repeat(6, 1fr);
    gap: 0.5rem;
    margin: 0 0.5rem;
  }
  .box {
    width: 100%;
    height: 100%;
    background-color: red;
    border-radius: 8px;
    border: 3px solid #f8d614;
    display: flex;
    align-items: center;
    color: #fff;
    font-family: var(--font-family);
    justify-content: center;
  }  
  .grid .box:nth-child(1) {
    /* grid-area: 1 / 1 / 2 / 3; */
    grid-row: 1 / 2;
    grid-column: 1 / 3;    
  }
  .grid .box:nth-child(3) {
    /* grid-area: 1 / 4 / 2 / 7; */
    grid-row: 1 / 2;
    grid-column: 4 /7;  
  }
  .grid .box:nth-child(5) {
    /* grid-area: 2 / 2 / 2 / 6; */
    grid-row: 2/ 2;
    grid-column: 2 / 6;  
  }
  .grid .box:nth-child(6) {
    /* grid-area: 2/ 6 / 4/ 6; */
    grid-row: 2 / 6;
    grid-column: 6 / 6;  
  }
</style>

<body>
  <h1>Cajas CSS GRID</h1>
  <section class="grid">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
  </section>
</body>

</html>
